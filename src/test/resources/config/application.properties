# Test-only signing key. Real runs read JWT_SECRET from the environment.
app.security.jwt.secret=test-only-signing-secret-of-at-least-32-bytes

# Lets tests count the SQL statements a lookup runs. Per-session metrics logging is silenced as noise.
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=WARN
