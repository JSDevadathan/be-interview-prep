name: Feature / task
description: New capability, improvement or technical task
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What should be built and why does it matter?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Background, related issues, constraints, relevant code.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable, testable outcomes.
      value: |
        - [ ]
        - [ ] Tests cover the new behaviour
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
